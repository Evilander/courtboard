services:
  courtboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courtboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - courtboard_data:/app/data
      - courtboard_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/ready').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  courtboard_data:
  courtboard_uploads:
