name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: test-auth-secret-for-ci-only
      AUTH_URL: http://127.0.0.1:3010
      DATABASE_URL: file:./data/ci.db
      COURTHOUSE_NAME: CI Courthouse
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: admin@courtboard.local
      INITIAL_ADMIN_PASSWORD: StrongPassword123!
      SESSION_MAX_AGE_SECONDS: 28800
      IDLE_TIMEOUT_MINUTES: 15
      MAX_FAILED_ATTEMPTS: 5
      ACCOUNT_LOCKOUT_MINUTES: 15
      AUTH_RATE_LIMIT_WINDOW_SECONDS: 60
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: 10
      UPLOAD_MAX_BYTES: 10485760
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:migrate

      - run: npm run db:seed

      - run: npm run lint

      - run: npm run test:integration

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
